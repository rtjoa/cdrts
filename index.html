<!DOCTYPE html>
<html>

<head>
    <title>Tree-based Text CRDT</title>
    <script src="script.js">
    </script>
    <style>
        .container {
            padding: 1rem;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        input {
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 0.25rem;
        }

        button {
            background: #3b82f6;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
        }

        .output {
            border: 1px solid #ccc;
            padding: 1rem;
            border-radius: 0.25rem;
            min-height: 3rem;
            font-family: monospace;
            white-space: pre;
        }

        textarea {
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 0.25rem;
            min-height: 100px;
            resize: vertical;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="input-group">
            <div>
                <textarea id="input1"></textarea>
                <br>
                <button id="send1">Commit</button>
                <div id="error1"></div>
                <br>
                <p>Tree</p>
                <div id="tree1" class="output"></div>
                <p>Incoming Messages</p>
                <div id="incoming1"></div>
            </div>
            <div>
                <textarea id="input2"></textarea>
                <br>
                <button id="send2">Commit</button>
                <div id="error2"></div>
                <br>
                <p>Tree</p>
                <div id="tree2" class="output"></div>
                <p>Incoming Messages</p>
                <div id="incoming2"></div>
            </div>
        </div>
    </div>
</body>


</html>
